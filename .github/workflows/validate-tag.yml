name: Validate Tag

# Server-side enforcement of lex-annotated-tags:
# every tag pushed to origin MUST be annotated (`git tag -a`) and GPG-signed
# (`git tag -s`). Lightweight tags are rejected and the remote ref is deleted.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag is annotated
        id: annotated
        run: |
          set -euo pipefail
          TAG_TYPE=$(git cat-file -t "$TAG_NAME")
          echo "Tag '$TAG_NAME' object type: $TAG_TYPE"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error title=Lightweight tag rejected::Tag '$TAG_NAME' is lightweight (object type: $TAG_TYPE). lex-annotated-tags requires annotated tags (git tag -a)."
            echo "result=lightweight" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=annotated" >> "$GITHUB_OUTPUT"

      - name: Verify tag follows SemVer
        if: steps.annotated.outcome == 'success'
        run: |
          set -euo pipefail
          # Pattern: optional v prefix + MAJOR.MINOR.PATCH + optional pre-release + optional build metadata
          if ! echo "$TAG_NAME" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error title=Invalid SemVer::Tag '$TAG_NAME' does not follow Semantic Versioning (lex-semantic-version)."
            exit 1
          fi
          echo "Tag '$TAG_NAME' follows Semantic Versioning."

      # GPG signature verification is best-effort: it depends on the signer's
      # public key being available to the runner. We try, but the gate is
      # primarily the lightweight-vs-annotated check above.
      - name: Verify GPG signature (best-effort)
        if: steps.annotated.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          if git tag -v "$TAG_NAME" 2>&1 | tee /tmp/sig.log | grep -qE 'Good signature|signature.*BAD|signature.*GOOD'; then
            if grep -q "Good signature" /tmp/sig.log; then
              echo "✓ GPG signature verified."
            else
              echo "::warning title=Signature unverified::GPG signature for '$TAG_NAME' could not be verified by the runner. The signer's public key may not be importable on the runner — the tag remains valid if locally signed."
            fi
          else
            echo "::warning title=No signature::Tag '$TAG_NAME' appears unsigned by GPG. lex-annotated-tags requires git tag -s."
          fi

      - name: Delete invalid tag from remote
        if: failure() && steps.annotated.outputs.result == 'lightweight'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "Deleting invalid tag '$TAG_NAME' from remote to prevent reactive workflows from consuming it."
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" || \
            echo "::warning::Failed to delete tag '$TAG_NAME' via API."
