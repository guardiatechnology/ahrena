name: Validate Tag

# Server-side enforcement of lex-annotated-tags:
# every tag pushed to origin MUST be annotated (`git tag -a`) and GPG-signed
# (`git tag -s`). Lightweight tags are rejected and the remote ref is deleted.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # actions/checkout@v4 with `fetch-tags: true` on a tag-push event can
      # materialize the local ref pointing to the peeled commit rather than
      # the annotated tag object — surfaced by the v0.12.0 release per Issue
      # #99. An explicit force-fetch of the tag ref re-attaches the annotated
      # tag object on the runner so `git cat-file -t` returns `tag` (not
      # `commit`).
      - name: Re-fetch tag explicitly to preserve annotated object
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" --force
          echo "Re-fetched tag '$TAG_NAME' from origin."

      - name: Verify tag is annotated
        id: annotated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_TYPE=$(git cat-file -t "$TAG_NAME")
          echo "Tag '$TAG_NAME' object type (local): $TAG_TYPE"
          if [ "$TAG_TYPE" != "tag" ]; then
            # Belt-and-suspenders: confirm via API before flagging lightweight.
            # Mitigates false positives from runner-side ref shape quirks
            # (see Issue #99). The remote ref is the source of truth.
            REMOTE_TYPE=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" --jq '.object.type' 2>/dev/null || echo "unknown")
            echo "Tag '$TAG_NAME' object type (API): $REMOTE_TYPE"
            if [ "$REMOTE_TYPE" = "tag" ]; then
              echo "::warning title=Local/remote ref mismatch::Local ref reports '$TAG_TYPE' but API reports 'tag' (annotated). Accepting based on API source of truth."
              echo "result=annotated" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Lightweight tag rejected::Tag '$TAG_NAME' is lightweight (object type local=$TAG_TYPE, API=$REMOTE_TYPE). lex-annotated-tags requires annotated tags (git tag -a)."
            echo "result=lightweight" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=annotated" >> "$GITHUB_OUTPUT"

      - name: Verify tag follows SemVer
        if: steps.annotated.outcome == 'success'
        run: |
          set -euo pipefail
          # Pattern: optional v prefix + MAJOR.MINOR.PATCH + optional pre-release + optional build metadata
          if ! echo "$TAG_NAME" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error title=Invalid SemVer::Tag '$TAG_NAME' does not follow Semantic Versioning (lex-semantic-version)."
            exit 1
          fi
          echo "Tag '$TAG_NAME' follows Semantic Versioning."

      # GPG signature verification is best-effort: it depends on the signer's
      # public key being available to the runner. We try, but the gate is
      # primarily the lightweight-vs-annotated check above.
      - name: Verify GPG signature (best-effort)
        if: steps.annotated.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          if git tag -v "$TAG_NAME" 2>&1 | tee /tmp/sig.log | grep -qE 'Good signature|signature.*BAD|signature.*GOOD'; then
            if grep -q "Good signature" /tmp/sig.log; then
              echo "✓ GPG signature verified."
            else
              echo "::warning title=Signature unverified::GPG signature for '$TAG_NAME' could not be verified by the runner. The signer's public key may not be importable on the runner — the tag remains valid if locally signed."
            fi
          else
            echo "::warning title=No signature::Tag '$TAG_NAME' appears unsigned by GPG. lex-annotated-tags requires git tag -s."
          fi

      - name: Delete invalid tag from remote
        if: failure() && steps.annotated.outputs.result == 'lightweight'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Second confirmation via API before destructive action: re-fetch the
          # remote ref and re-check object type. Only proceed with delete if
          # the API also reports the tag as lightweight (object type = commit).
          # Guards against false positives from the local checkout — see
          # Issue #99 root cause (actions/checkout@v4 peeling quirk).
          REMOTE_TYPE=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" --jq '.object.type' 2>/dev/null || echo "unknown")
          echo "Pre-delete confirmation — tag '$TAG_NAME' object type (API): $REMOTE_TYPE"
          if [ "$REMOTE_TYPE" = "tag" ]; then
            echo "::warning title=Delete skipped::API reports tag as annotated; refusing to delete despite local lightweight detection. Likely runner-side ref shape quirk; the tag remains valid on remote."
            exit 0
          fi
          if [ "$REMOTE_TYPE" = "unknown" ]; then
            echo "::warning title=Delete skipped::Could not confirm tag type via API. Refusing to delete to avoid data loss."
            exit 0
          fi
          echo "Deleting invalid tag '$TAG_NAME' from remote to prevent reactive workflows from consuming it."
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" || \
            echo "::warning::Failed to delete tag '$TAG_NAME' via API."
