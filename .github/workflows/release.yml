name: Release

# A single tag (`v*`) ships both products in the same GitHub Release:
#   - the framework bundle (`ahrena.zip` + bare scripts + Makefile)
#   - the `ahrena-mcp` Python package (wheel + sdist), built from
#     tools/ahrena-mcp/ at whatever version is in its own pyproject.toml
#
# The MCP wheel filename carries its own version (e.g.
# `ahrena_mcp-0.1.0a1-py3-none-any.whl`), so the two products keep
# independent identities while shipping together.
#
# The release job depends on:
#   - mcp-tests: full pytest suite for `ahrena-mcp` must pass before we
#     produce a release wheel for it.
#   - mcp-smoke: smoke install of the wheel exercised across every
#     Python version declared in the package's `requires-python`
#     window (3.10–3.13). The build itself is `py3-none-any`, but
#     installability and `--help` resolution are validated per Python.
#
# Out of scope (deferred per plan-021 §Release & Distribution):
#   - PyPI publishing for ahrena-mcp. Distribution v1 is GitHub Release
#     only; PyPI moves to a future plan once the tool surface stabilizes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ahrena-mcp with dev extras
        run: python -m pip install --upgrade pip "tools/ahrena-mcp[dev]"

      - name: Run ahrena-mcp test suite
        run: pytest tools/ahrena-mcp/tests -q

  mcp-smoke:
    runs-on: ubuntu-latest
    needs: mcp-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel --outdir dist tools/ahrena-mcp

      - name: Install wheel into a clean venv and run --help
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/ahrena-mcp --help

  release:
    runs-on: ubuntu-latest
    needs: [mcp-tests, mcp-smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Stage release assets
        run: mkdir -p release-assets

      - name: Package framework (ahrena.zip + scripts + Makefile)
        run: |
          zip -r release-assets/ahrena.zip \
            framework/ \
            scripts/install.py \
            scripts/update.py \
            scripts/uninstall.py \
            Makefile
          # Bare copies enable curl-based bootstrap (Makefile target /
          # scripts/install.py) without unzipping ahrena.zip; consumers
          # wanting the full framework download ahrena.zip. Both forms
          # were already attached by the previous workflow — preserved
          # for backward compatibility.
          cp Makefile release-assets/
          cp scripts/install.py scripts/update.py scripts/uninstall.py release-assets/

      - name: Build ahrena-mcp (sdist + wheel)
        run: python -m build --outdir "${GITHUB_WORKSPACE}/release-assets" tools/ahrena-mcp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
