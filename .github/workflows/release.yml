name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package ahrena.zip
        run: |
          zip -r ahrena.zip \
            framework/ \
            scripts/install.py \
            scripts/update.py \
            scripts/uninstall.py \
            Makefile

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            scripts/install.py
            scripts/update.py
            scripts/uninstall.py
            ahrena.zip
